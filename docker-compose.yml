version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=travila
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - app_network

  # Backend (Node.js / Express) service
  backend:
    build: ./backend
    container_name: backend
    # environment:
    ports:
      - "3001:3001"  # Your backend API will be on port 3001
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app_network

  # Frontend (React app) service
  frontend:
    build: ./front-end
    container_name: frontend
    ports:
      - "3000:3000"  # Your frontend will be on port 3000
    depends_on:
      - backend
    volumes:
      - ./front-end:/app
      - /app/node_modules  # This ensures node_modules stays inside the container
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data: